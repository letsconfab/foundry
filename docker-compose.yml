version: '3.8'

services:
  db:
    image: postgres:18.1
    container_name: confab-foundry-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-default_pass_change_me}
      POSTGRES_DB: confab_foundry_db
    ports:
      - "7432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    networks:
      - confab-foundry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: confab-foundry-api
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-default_pass_change_me}@db:5432/confab_foundry_db
    ports:
      - "8001:8001"
    volumes:
      - ./api:/app
    networks:
      - confab-foundry-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  confab-foundry-network:
    driver: bridge

volumes:
  postgres_data: 